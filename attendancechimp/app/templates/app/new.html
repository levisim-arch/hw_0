<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AttendanceChimp Sign Up</title>
  <style>
    body { text-align: center; }
    label { display: inline-block; }
  </style>
</head>
<body>
  <h1>Sign Up</h1>
  <form method="post" action="/app/createUser">
    {% csrf_token %}
    <label>User name: <input type="text" name="user_name" required></label><br>
    <label>Email: <input type="email" name="email" required></label><br>
    <label>Password: <input type="password" name="password" required></label><br>
    <label><input type="radio" name="is_student" value="1" checked> Student</label>
    <label><input type="radio" name="is_student" value="0"> Instructor</label><br>
    <button type="submit">Sign Up</button>
  </form>
</body>
</html>
