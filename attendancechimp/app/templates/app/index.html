<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AttendanceChimp</title>
    <style>
        body { text-align: center; margin: 40px; }
        .bio { margin: 0 auto; }
        .username { font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>
<div class="bio">
    <h1>AttendanceChimp</h1>
    <p>Electronic class attendance tracking application based in Django.</p>
    <hr>

    <p>
        {% if user_name %}
            Logged in as <strong class="username">{{ user_name }}</strong>
        {% else %}
            Not logged in.
        {% endif %}
    </p>

        <p>Current time (CST): {{ current_time }}</p>

    {% if not user_name %}
        <p><a href="/accounts/login/">Log in</a> &middot; <a href="/app/new">Sign up</a></p>
    {% endif %}
</div>
</body>
</html>
